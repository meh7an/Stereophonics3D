[package]
name = "s3d-testscene"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ash = "0.38.0"
ash-window = "0.13.0"
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.34.1"
s3d-shared = { version = "0.1.0", path = "../shared" }
s3d-verify = { version = "0.1.0", path = "../verify" }
tracing = "0.1.44"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }
winit = "0.30.13"
